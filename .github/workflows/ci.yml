name: DevGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests and Gitleaks Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build --pull -t devguard:ci .

      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 5000:5000 devguard:ci
          for i in $(seq 1 20); do
            curl -fs http://localhost:5000/health && break || sleep 2
          done
          curl -fs http://localhost:5000/health
          curl -fsI http://localhost:5000/static/socket.io.min.js
          docker rm -f smoke

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devguard:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push verified image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          TAG=${GITHUB_SHA::7}
          docker tag devguard:ci "$DH_USER/devguard:$TAG"
          docker tag devguard:ci "$DH_USER/devguard:latest"
          docker push "$DH_USER/devguard:$TAG"
          docker push "$DH_USER/devguard:latest"