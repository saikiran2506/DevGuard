---
# Roll traffic back to a colour that is still running.
# Run on the server:  ansible-playbook rollback.yml -e target=blue
- name: Roll DevGuard back to a chosen colour
  hosts: devguard
  become: true
  gather_facts: false

  vars:
    switch_script: /usr/local/bin/switch-color.sh
    public_health_url: http://127.0.0.1/health

  tasks:
    - name: Require a valid target colour
      ansible.builtin.assert:
        that:
          - target is defined
          - target in ['blue', 'green']
        fail_msg: "Pass -e target=blue or -e target=green"
        quiet: true

    - name: Switch traffic (the script refuses if the colour is unhealthy)
      ansible.builtin.command: "{{ switch_script }} {{ target }}"
      register: switch_result
      changed_when: "'SWITCHED' in switch_result.stdout"

    - name: Confirm the public site reports the chosen colour
      ansible.builtin.uri:
        url: "{{ public_health_url }}"
        return_content: true
      register: public_health
      until: public_health.json is defined and public_health.json.color == target
      retries: 10
      delay: 2
